name: Panel

# Publica panel.cumplegratis.fun cuando cambia el panel o los datos (nombres de promos/ciudades en meta.json).
on:
  push:
    branches: [main]
    paths: [panel/**, src/data/promos.json, src/lib/places.ts, .github/workflows/panel.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node panel/build.mjs
      - run: npx wrangler@4 deploy
        working-directory: panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f667ba6801616571296d9679dddb9c39
