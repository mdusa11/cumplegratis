name: Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reconstruye a diario para que las promos vencidas desaparezcan solas.
  schedule:
    - cron: "0 11 * * *"

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    # Hasta que exista el secreto, solo corre a mano; luego CLOUDFLARE_READY=true activa push y cron.
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
      # Worker "cumplegratis" con assets estáticos (wrangler.jsonc).
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f667ba6801616571296d9679dddb9c39
